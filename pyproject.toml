[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fruitfresh"
version = "1.0.0"
description = "Fresh-versus-rotten fruit classification: CNN baseline vs MobileNetV2 transfer learning"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: end-to-end tests that train tiny models"]
